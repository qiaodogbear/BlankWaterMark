[package]
name = "blind-watermark"
version = "0.1.0"
description = "BlindWaterMark desktop and mobile shell"
authors = ["BlindWaterMark contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "blind_watermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
crc32fast = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
thiserror = "2"
